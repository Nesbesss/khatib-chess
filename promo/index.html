<!doctype html><html><head><meta charset="utf-8"><title>KHATIB — Your move.</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020604;color:#edfff0;font-family:Arial,Helvetica,sans-serif}#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:#020604}canvas{position:absolute;inset:0}#shade{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 48%,transparent 15%,#020604b0 80%)}#scan{position:absolute;inset:0;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#000 4px);pointer-events:none}.corner{position:absolute;font:18px monospace;letter-spacing:3px;color:#a5bbab}#brand{left:74px;top:57px;color:#eaffec;font-weight:bold;font-size:24px;letter-spacing:6px}#mode{right:74px;top:63px}#bottom{left:74px;bottom:55px}#count{right:74px;bottom:55px}#copy{position:absolute;left:130px;top:50%;transform:translateY(-50%);width:1660px}#eyebrow{font:20px monospace;letter-spacing:7px;color:#9bff69;margin-bottom:30px}h1{font-size:146px;line-height:.94;letter-spacing:-9px;margin:0;font-weight:900}#sub{font-size:32px;letter-spacing:1px;color:#b8ccbd;margin-top:35px;line-height:1.5}#line{height:5px;width:80px;background:#a3ff57;margin-top:44px;box-shadow:0 0 25px #9aff5c}#flash{position:absolute;inset:0;background:#c7ffb6;opacity:0;pointer-events:none}#silence{position:absolute;inset:0;background:#020604;opacity:0}#silenceWord{position:absolute;width:100%;top:46%;text-align:center;font-size:36px;letter-spacing:11px;color:#e5ffea}#bar{position:absolute;bottom:0;left:0;height:3px;background:#a8ff6c}#orbit{position:absolute;right:150px;top:195px;width:580px;height:580px;border:1px solid #aaff5530;border-radius:50%;box-shadow:0 0 100px #83ff3310;opacity:0}#orbit:after{content:'';position:absolute;inset:30px;border:1px dashed #aaff5555;border-radius:50%}
</style></head><body><div id="stage" data-composition-id="khatib" data-width="1920" data-height="1080" data-duration="40" data-start="0"><canvas id="world"></canvas><div id="shade"></div><div id="orbit"></div><div id="copy"><div id="eyebrow"></div><h1 id="title"></h1><div id="sub"></div><div id="line"></div></div><div id="scan"></div><div class="corner" id="brand">K / KHATIB</div><div class="corner" id="mode">NEURAL CHESS ENGINE</div><div class="corner" id="bottom">64 SQUARES. NO SAFE MOVES.</div><div class="corner" id="count"></div><div id="silence"><div id="silenceWord"></div></div><div id="flash"></div><div id="bar"></div><audio src="assets/score.wav" data-start="0" data-duration="40" data-track-index="2"></audio></div><script src="assets/gsap.min.js"></script><script type="module">
import * as THREE from './assets/three.module.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#world'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(1920,1080);renderer.setPixelRatio(1);renderer.setClearColor(0x030906);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x030906,.035);const camera=new THREE.PerspectiveCamera(43,1920/1080,.1,100);scene.add(new THREE.HemisphereLight(0xc6ffce,0x07140b,2.3));const key=new THREE.DirectionalLight(0xdcffe2,4);key.position.set(-4,9,6);scene.add(key);const green=new THREE.PointLight(0x8aff36,100,35);green.position.set(3,3,-4);scene.add(green);const rim=new THREE.PointLight(0x3affa9,70,30);rim.position.set(-6,4,1);scene.add(rim);
const board=new THREE.Group();scene.add(board);const mats=[new THREE.MeshStandardMaterial({color:0x193825,metalness:.65,roughness:.27}),new THREE.MeshStandardMaterial({color:0x070d0a,metalness:.55,roughness:.24})];
for(let x=0;x<8;x++)for(let z=0;z<8;z++){let m=new THREE.Mesh(new THREE.BoxGeometry(.98,.16,.98),mats[(x+z)%2]);m.position.set(x-3.5,-.16,z-3.5);board.add(m)}
const plinth=new THREE.Mesh(new THREE.BoxGeometry(8.3,.22,8.3),new THREE.MeshStandardMaterial({color:0x09140d,metalness:.8,roughness:.2}));plinth.position.y=-.34;board.add(plinth);
const white=new THREE.MeshStandardMaterial({color:0xd8efda,metalness:.52,roughness:.21});const black=new THREE.MeshStandardMaterial({color:0x123d25,metalness:.8,roughness:.23});const glow=new THREE.MeshStandardMaterial({color:0xa0ff4f,emissive:0x66ee22,emissiveIntensity:.7,metalness:.6,roughness:.2});
function piece(type,mat){let g=new THREE.Group();const profile=[[0,0],[.30,0],[.32,.08],[.28,.15],[.23,.18],[.20,.26],[.13,.38],[.10,.65],[.19,.74],[.19,.82],[.12,.88],[0,.9]];let h=type==='p'?.76:type==='k'?1.45:1.1;let lathe=new THREE.Mesh(new THREE.LatheGeometry(profile.map(([r,y])=>new THREE.Vector2(r,y*h)),32),mat);g.add(lathe);let head;if(type==='p')head=new THREE.Mesh(new THREE.SphereGeometry(.19,20,16),mat);else if(type==='r')head=new THREE.Mesh(new THREE.CylinderGeometry(.25,.21,.24,8),mat);else head=new THREE.Mesh(new THREE.SphereGeometry(type==='q'?.21:.16,16,12),mat);head.position.y=.92*h;g.add(head);if(type==='k'){for(let [x,y,z] of [[.09,.48,.09],[.34,.09,.09]]){let m=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat);m.position.y=1.62;g.add(m)}}if(type==='n'){let m=new THREE.Mesh(new THREE.BoxGeometry(.24,.36,.38),mat);m.rotation.x=-.4;m.position.set(0,1.08,.08);g.add(m)}return g}
const pieces=[];for(let side=0;side<2;side++)for(let x=0;x<8;x++)for(let rank=0;rank<2;rank++){let type=rank?'p':['r','n','b','q','k','b','n','r'][x];let p=piece(type,side?black:white);p.position.set(x-3.5,0,side?rank-3.5:3.5-rank);p.userData={x:p.position.x,z:p.position.z,side,type};board.add(p);pieces.push(p)}
const hero=piece('k',glow);hero.scale.setScalar(2.6);hero.position.set(2.9,.2,0);scene.add(hero);
const grid=new THREE.GridHelper(100,100,0x245933,0x0c2314);grid.position.y=-.49;scene.add(grid);
const positions=[];for(let i=0;i<750;i++){let a=Math.sin(i*127.1)*43758.5453,b=Math.sin(i*311.7)*12515.73,c=Math.sin(i*74.7)*9351.21;positions.push((a-Math.floor(a)-.5)*38,(b-Math.floor(b))*15,(c-Math.floor(c)-.5)*30)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const dust=new THREE.Points(geo,new THREE.PointsMaterial({color:0x95ff66,size:.035,transparent:true,opacity:.65}));scene.add(dust);
const $=s=>document.getElementById(s);const shots=[
[0,2.57,'EVERY MOVE','IS A QUESTION.','64 squares. Infinite pressure.','01 / THE GAME'],
[2.57,5.14,'CALCULATE.','','','02 / THE SEARCH'],[5.14,7.71,'ANTICIPATE.','','','03 / THE THREAT'],[7.71,10,'OUTTHINK.','','','04 / THE EDGE'],
[13,17,'KHATIB.','','A neural chess engine by Nassim Khatib.','INTRODUCING'],
[17,21,'AN UNDER-18<br>CHAMPION.','BEATEN.','','THE RESULTS'],
[21,25,'BOTS.','BEATEN.','Opponent after opponent.','THE RESULTS'],
[25,29,'BUILT TO<br>GO DEEPER.','','Neural evaluation. Relentless search.','UNDER THE SURFACE'],
[29,34,'STILL<br>IMPROVING.','','Self-play. Train. Test. Repeat.','THIS IS ONLY THE OPENING'],
[34,40,'YOUR MOVE.','','KHATIB  /  OPEN-SOURCE CHESS AI','CHALLENGE WHAT COMES NEXT']];
let state={t:0};function draw(){let t=state.t;let shot=shots.find(s=>t>=s[0]&&t<s[1])||shots[0];let local=t-shot[0],en=1-Math.pow(1-Math.min(Math.max(local,0)/.65,1),4);let reveal=t>=13;let end=t>=34;
$('title').innerHTML=shot[2]+(shot[3]?'<br><span style="color:#a5ff60">'+shot[3]+'</span>':'');$('sub').textContent=shot[4];$('eyebrow').textContent=shot[5];$('copy').style.opacity=t>=10&&t<13?0:Math.min(local*5,1);$('copy').style.transform=`translate(${(1-en)*100}px,-50%) scale(${1+(1-en)*.12})`;$('copy').style.transformOrigin='left center';$('title').style.fontSize=(t>=17&&t<21?'119':t>=13&&t<17?'222':t>=34?'170':'146')+'px';$('copy').style.width=t>=17&&t<34?'1250px':'1660px';$('line').style.width=80+Math.max(0,local)*23+'px';$('count').textContent=(t<13?'SEARCH / ':'ENGINE / ')+String(Math.floor(t*30)).padStart(4,'0');$('bottom').textContent=t>=34?'github.com/Nesbesss/khatib-chess':'64 SQUARES. NO SAFE MOVES.';$('bar').style.width=t/40*1920+'px';$('orbit').style.opacity=t>=13&&t<34?.4:0;
$('silence').style.opacity=t>=10&&t<13?1:t>39?(t-39):0;$('silenceWord').textContent=t>=11&&t<12.8?'UNTIL NOW.':'';let hit=[0,2.57,5.14,7.71,13,17,21,25,29,34].reduce((v,s)=>Math.max(v,t>=s?Math.max(0,1-(t-s)/.15):0),0);$('flash').style.opacity=hit*.38;
board.visible=!reveal||t>=21;hero.visible=reveal;hero.rotation.y=t*.3;hero.position.y=.1+Math.sin(t*1.7)*.09;hero.position.x=end?3.4:3.1;hero.scale.setScalar(end?2.1:2.6);board.position.set(reveal?2.7:0,reveal?-1.3:0,reveal?-2:0);board.scale.setScalar(reveal?.73:1);board.rotation.y=t*.06;
if(!reveal){let cut=Math.floor(t/2.57);let angle=t*.35+cut*.85;camera.position.set(Math.sin(angle)*9,5.5+Math.sin(t*.7)*2,Math.cos(angle)*9);camera.lookAt(0,.4,0)}else{camera.position.set(.2+Math.sin(t*.15)*.3,4.7,13.8);camera.lookAt(0,1.6,0)}
for(let i=0;i<pieces.length;i++){let p=pieces[i],u=p.userData;p.position.x=u.x;p.position.z=u.z;if(u.type==='p'){let phase=Math.max(0,Math.min(1,(t-(i%8)*.33-1)));p.position.z+=phase*(u.side?1:-1)*(i%3===0?2:1)}p.position.y=t>7.71&&t<10?Math.pow((t-7.71)/2.29,2)*(i%5)*.35:0;}
dust.rotation.y=t*.025;green.intensity=90+Math.sin(t*7)*15;renderer.render(scene,camera)}
window.__timelines=window.__timelines||{};window.__timelines.khatib=gsap.timeline({paused:true}).to(state,{t:40,duration:40,ease:'none',onUpdate:draw});draw();
</script></body></html>
