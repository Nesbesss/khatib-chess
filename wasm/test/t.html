<script type="module">
import init, { Kraken } from './kraken_wasm.js';
(async () => {
  await init();
  const k = new Kraken();
  const net = new Uint8Array(await (await fetch('./net.nnue')).arrayBuffer());
  const loaded = k.load_network(net);
  k.set_position("");
  const t0 = performance.now();
  const mv = k.best_move(8, false);
  const dt = performance.now() - t0;
  document.title = JSON.stringify({
    net: loaded, move: mv, ms: Math.round(dt),
    legal: k.legal_moves().split(' ').length,
    status: k.status(), eval: k.evaluate()
  });
})();
</script>
