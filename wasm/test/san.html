<script type="module">
import init, { Kraken } from './kraken_wasm.js';
(async () => {
  await init();
  const k = new Kraken();
  const cases = [
    ["e2e4 e7e5 g1f3 b8c6 f1b5", "Ruy Lopez"],
    ["e2e4 e7e5 g1f3 b8c6 f1c4 f8c5 e1g1", "castling"],
    ["e2e4 d7d5 e4d5 d8d5 b1c3", "captures"],
    ["g1f3 g8f6 b1c3 b8c6 f3e5 c6e5", "knight disambiguation"],
    ["f2f4 e7e5 g2g4 d8h4", "checkmate"],
  ];
  const out = [];
  for (const [mv, label] of cases) {
    k.set_position(mv);
    out.push(label + ": " + k.san_history());
  }
  document.title = out.join(" | ");
})();
</script>
